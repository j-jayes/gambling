project:
  name: worldcup_markets
  timezone: UTC
  tournament: fifa_world_cup_2026

pipeline:
  lookback_years: 12
  snapshot_frequencies:
    historical_backfill: daily
    prematch_refresh: hourly
    near_kickoff_refresh: every_5_min

storage:
  bronze_path: data/bronze
  silver_path: data/silver
  gold_path: data/gold
  db_path: data/silver/worldcup_markets.duckdb

modeling:
  random_seed: 42
  train_start_date: "2014-01-01"
  validation_start_date: "2022-01-01"
  test_start_date: "2024-01-01"

backtest:
  min_edge: 0.02
  max_position_fraction: 0.03
  kelly_fraction: 0.5
