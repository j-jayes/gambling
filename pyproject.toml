[project]
name = "worldcup-markets"
version = "0.1.0"
description = "Research-first World Cup 2026 prediction markets pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.1",
  "xgboost>=2.1.0",
  "pyarrow>=17.0.0",
  "duckdb>=1.0.0",
  "requests>=2.32.3",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "python-dateutil>=2.9.0",
  "soccerdata>=1.8.8",
  "typer>=0.12.3",
  "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.6",
  "mypy>=1.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
